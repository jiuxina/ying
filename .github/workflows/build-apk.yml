name: Build and Publish Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          channel: stable
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test --concurrency=1 --timeout 30s

      - name: Prepare release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is required for release builds"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Build ABI-split release APKs
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          flutter build apk --release --split-per-abi \
            --split-debug-info=build/debug-info \
            --obfuscate \
            --tree-shake-icons

      - name: Verify release signatures
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          for apk in build/app/outputs/flutter-apk/*-release.apk; do
            if "$APKSIGNER" verify --print-certs "$apk" | grep -q "Android Debug"; then
              echo "::error::Release APK is signed with the debug key: $apk"
              exit 1
            fi
            echo "Verified: $apk"
          done

      - name: Generate checksums
        run: |
          mkdir -p build/release
          (cd build/app/outputs/flutter-apk && sha256sum *-release.apk) > build/release/SHA256SUMS.txt
          cat build/release/SHA256SUMS.txt

      - name: Archive debug info
        run: |
          if [ -d build/debug-info ]; then
            (cd build && zip -r debug-info.zip debug-info)
          fi

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: ying-release-apks
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload debug info (symbols)
        uses: actions/upload-artifact@v4
        with:
          name: ying-debug-info
          path: build/debug-info/
          if-no-files-found: warn
          retention-days: 90

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          NOTES="docs/RELEASE_NOTES-${TAG#v}.md"
          ASSETS=()
          for apk in build/app/outputs/flutter-apk/*-release.apk; do
            ASSETS+=("$apk")
          done
          ASSETS+=(build/release/SHA256SUMS.txt)
          if [ -f build/debug-info.zip ]; then
            ASSETS+=(build/debug-info.zip)
          fi
          if [ -f "$NOTES" ]; then
            gh release create "$TAG" "${ASSETS[@]}" --title "萤 $TAG" --notes-file "$NOTES"
          else
            gh release create "$TAG" "${ASSETS[@]}" --title "萤 $TAG" --generate-notes
          fi
